name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The repository's default workflow token is write-scoped; this build only needs to read the checkout.
permissions:
  contents: read

# Cancel superseded PR runs (JS, wasm, native and detekt all run here), but let master runs finish.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to a commit SHA, with the release in a trailing comment; Dependabot updates both.
# Every job has a timeout, so a hung test cannot hold a runner for the 6-hour default.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so keep the token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # `build` runs lintKotlin and detekt through `check`, so there is no separate lint step.
      - name: Build and test
        run: ./gradlew build

      - name: Generate Kover XML coverage report
        run: ./gradlew koverXmlReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          fail_ci_if_error: false
          verbose: true

  # The Linux job above runs the KMP modules' jvm, js, wasmJs and linuxX64 tests. A Linux host cannot run the
  # Apple or mingw test executables, so these jobs cover them. The task names are unqualified, so every KMP
  # module's tests run. The watchOS/tvOS simulator test tasks are disabled in the build, and Gradle skips
  # iosX64Test on the arm64 runner.
  native-apple:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # setup-gradle caches ~/.gradle but not the Kotlin/Native toolchain. The catalog pins the Kotlin plugin
      # (through the convention plugins), so its hash is a good cache key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Run macOS and iOS simulator tests
        run: ./gradlew macosArm64Test iosSimulatorArm64Test

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Run mingwX64 tests
        shell: bash
        run: ./gradlew mingwX64Test
