name: KDocs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Pages and OIDC rights belong to the deploy job alone; the build job, which runs PR code, only reads.
permissions:
  contents: read

# A concurrency group holds at most one running and one pending run; a newly queued run cancels
# the pending one. Grouping by ref keeps PR builds (refs/pull/<n>/merge) from replacing a pending
# master Pages deploy, while master runs still serialize so an in-progress deploy always finishes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to a commit SHA, with the release in a trailing comment; Dependabot updates both.
jobs:
  kdocs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Generate KDocs
        run: ./gradlew :dokkaGenerate

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dokka/html

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: kdocs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
