name: KDocs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

# A concurrency group holds at most one running and one pending run; a newly queued run cancels
# the pending one. Grouping by ref keeps PR builds (refs/pull/<n>/merge) from replacing a pending
# master Pages deploy, while master runs still serialize so an in-progress deploy always finishes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  kdocs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Generate KDocs
        run: ./gradlew :dokkaGenerate

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/html

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: kdocs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
